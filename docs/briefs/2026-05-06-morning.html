  .usage-details { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); }

ower to shift these external costs to passengers, enabling a systematic margin recovery window before competitors force price compression and capacity rationalization accelerates.", "source": "CNBC", "link": "https://news.google.com/rss/articles/CBMilAFBVV95cUxNVWM3NXJ2Y3hvd2Z0c09ZcWtXSTU4VXU2YlpnU3dhR0pZSk1nYUxTVTlSTFpCQXpJRkxiYU5MM09sYUJaaXZ0RW5zdzZET2E0cjNPaVQ2UVhZa1ZxRVlOSTBaSHhIVS1aRW1lN0dRV3pOajZxcFREY0lwbTk4VlZYWVVlbXdENm5vUW9RMGRqaDc2YWky0gGaAUFVX3lxTE5kMENvWEJiNGJnUUMwRjdLazhHeERxYW1vMmVhMkg1aVQyUU5oZTI4bVk5NmJkeTJnMDNVS29PYlcxQTBUWlh0QUNSakFEZk1ycHBXRk85V2F6b3RhbktMRlNoM195Y3k1VHl5OE9QTkhKMTg1dURhUDdaWUpzblNQNy1SYkk3VXhYZWR5SVlCbUtaa3dhbzE5b2c?oc=5"}, {"headline": "Iran war triggers Asian plastic shortage, may spur Middle East plus one supply chain rethink", "summary": "Petrochemical supply disruptions from the Iran conflict are creating plastic scarcity across Asia, forcing multinational companies to reconsider concentration risk in Middle East hydrocarbon sourcing.", "insight": "This catalyzes the first concrete execution of 'Middle East plus one' diversification: manufacturers holding high inventory buffers will gain pricing power over competitors forced to source at spot rates, creating a 12-18 month window where supply chain optionality becomes a working capital advantage.", "source": "Fortune", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxPSEN0bzk1Y3FZZnVnd2QyeUVuLTVTTlRSd0VLaDEyUS1sSWQ4MUl3NFR5R0FMQmMxRVZNVnN0TjhWYzZ2Ml9CWFA5UzFtOXZNaFVJWG5yM3NRdy1BeHdXQWxYaThfT1E0Yl81bWF0UFBESllOMFYzb01acUZBVnFyOTRVRDJUb2E4d1E?oc=5"}, {"headline": "China to Invest in DeepSeek at 50 billion dollar Valuation", "summary": "China committed capital to DeepSeek, a domestic AI lab, at a 50 billion dollar valuation, signaling state backing for an alternative to Western large language models.", "insight": "This represents Beijing's formal domestication of frontier AI development, decoupling Chinese ML from Western dominance and reducing foreign policy leverage over AI capability; paired with chip sanctions, this creates a parallel AI ecosystem where training cost asymmetries (lower Chinese electricity, labor) compress global model performance differentials faster than prior cycles allowed.", "source": "WSJ", "link": "https://news.google.com/rss/articles/CBMikgFBVV95cUxOdHRsUlBlaW5mOFVldmVBVFh5ZnM4UGlCcGlRbUt4X29hUzh2UXVyclYybnZpVTJKblp4TDR6cVNUTFRKSWxITU8tUGp3Ym9mMENLaGRydHowVldYWnJUUV9kUjE5MUtuTDNqazJldkRJT05PN2NiUHV0N1lHZlU3STN6amVUUXlvRVNQWFpIU2ZIQQ?oc=5"}]}, {"name": "Culture & Sports", "stories": [{"headline": "What did America sound like in 1776? A local ensemble goes sleuthing for the answer", "summary": "A Chicago-based music ensemble is reconstructing historical American music from the Revolutionary War era through archival research and period instrument performance.", "insight": "This represents the commercialization of nostalgia-as-intellectual-property: heritage authenticity serves as brand differentiation in crowded music content markets, creating moat-building mechanisms for ensembles that control primary source narratives before algorithmic discovery renders them fungible.", "source": "WBEZ Chicago", "link": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxOY2pLVjA1T2phMzVBSXNWdUNVWWxpb0twdnBSTzctRmhKZjFLcWRGUVlPRXBTVTVfX29RNE1BdDB2LTVzWFVvNjk5b0QyVThYZUMtTHREYldqUHdkUEFNNVpReXNJM011X21rNWUxcUp2UGFBNlozbUNjM1I3ZkRzVGV3N3RRZ3V6dGktZFJIdVpkRVUyTUM4MFQyaEZoZUdTTE5uYXdVNlNUeHkxNGstcmgtYVNCWGpMRjZv?oc=5"}, {"headline": "How Black Rabbit Builds Its Cool, Chaotic New York World", "summary": "Netflix is profiling Black Rabbit, a narrative series set in New York, examining the creative process behind world-building and character development in prestige television.", "insight": "Platform-native content criticism disguised as documentary creates closed-loop marketing where production narrative becomes consumable content itself; this lengthens viewer engagement funnel while generating secondary distribution assets that recycle production costs across multiple content categories.", "source": "Netflix", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxOU0tGdHlCbXZWZGhEeEphUnhaOEUwRF9BeDF5S2o5czN1YjNiMmVweVNjYks3ai02TV94d3pJN1Y4QXkzSTBKdmlYdlpxVUZCMWl2di1UaUVwSHZfckFDNHlDakRjU0JpWFZzc0hGQ0VPU0lhRDhldFQ5QXdpRmFTRXVSaVB2cWdLM3c?oc=5"}]}, {"name": "Boston", "stories": [{"headline": "Mass. State Police trooper seriously injured, other driver dead in wrong-way crash on Route 1", "summary": "A wrong-way collision on Route 1 in Lynnfield resulted in one fatality and a state trooper being hospitalized with critical injuries, forcing temporary road closures.", "insight": "High-profile trooper injuries drive budget authority for traffic enforcement infrastructure; agencies typically leverage such incidents to justify increased radar deployment and camera monitoring, creating downstream revenue streams from automated enforcement that persist beyond the immediate incident cycle.", "source": "WCVB", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxOTkF3MUhnMmYzSHpXWW9iNVlBQUg2cUpKb0VNclNhQWJ4Z21UclZHYXczSmttMjNtWGtTbTc1MHc3Y1YxUTIwcDVxV1pJM3pDT1hMelVURllYdXR1ZW10VGZub0dZenlBNEJIZ2hfWlJRbTZuSnUyUjBYOVd2YmlSQ00tZzNQRnNlc1E?oc=5"}]}];
const edgeText = "The Iran war is bifurcating global capital flows: while Western institutional capital reprices around geopolitical tail risk (UK gilt yields, Fed rate expectations), China is simultaneously capturing autonomous AI development and securing petrochemical supply chains through state-backed alternatives. This creates a structural advantage for allocators positioned in China-exposed private credit and domestic AI infrastructure, as Western capital is locked into higher duration risk and forced capital reallocation cycles.";
const tomorrowText = "";
const colors = {"Breaking News": "#CC0000", "Finance & Markets": "#CC0000", "Politics & Policy": "#7A1010", "AI & Technology": "#7A1010", "International": "#888888", "Culture & Sports": "#888888", "Boston": "#888888"};
const quotes = [{"ticker": "SPY", "label": "S&P 500", "price": "723.77", "change_pct": "0.8022"}, {"ticker": "IWB", "label": "Russell 1000", "price": "395.41", "change_pct": "0.7696"}, {"ticker": "IWM", "label": "Russell 2000", "price": "282.56", "change_pct": "1.6842"}, {"ticker": "EFA", "label": "MSCI EAFE", "price": "102.04", "change_pct": "1.3307"}, {"ticker": "FFR", "label": "MM Yield (avg)", "price": "3.64%", "change_pct": "0", "is_yield": true}];
const sectionOrder = ["Breaking News", "Finance & Markets", "Politics & Policy", "AI & Technology", "International", "Culture & Sports", "Boston"];
const noInsight = ["Breaking News"];

const TIER_BY_COLOR = { '#CC0000':1, '#7A1010':2, '#888888':3 };

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}

// Usage banner
if (usageInfo && usageInfo.cost_monthly_projected !== undefined) {
  const monthly = usageInfo.cost_monthly_projected;
  const cost = usageInfo.cost_this_call || 0;
  const tokens = usageInfo.total_tokens || 0;
  const budget = 10.0;
  const pct = Math.min(100, (monthly / budget) * 100);
  let barColor, status;
  if (monthly < 2)      { barColor = '#5599CC'; status = 'LOW'; }
  else if (monthly < 5) { barColor = '#888888'; status = 'MODERATE'; }
  else                  { barColor = '#CC0000'; status = 'HIGH'; }

  document.getElementById('usage').innerHTML =
    '<div class="usage-banner">' +
      '<div class="usage-row">' +
        '<span class="usage-label">API Usage</span>' +
        '<span class="usage-status" style="color:' + barColor + '">' + status + '</span>' +
      '</div>' +
      '<div class="usage-bar"><div class="usage-bar-fill" style="background:' + barColor + ';width:' + pct.toFixed(0) + '%"></div></div>' +
      '<div class="usage-details">$' + cost.toFixed(4) + ' this brief &middot; ' + tokens.toLocaleString() + ' tokens &middot; $' + monthly.toFixed(2) + '/mo projected &middot; $10.00 budget</div>' +
    '</div>';
}

// Market bar
const marketBar = document.getElementById('market-bar');
quotes.forEach(q => {
  const card = document.createElement('div');
  card.className = 'market-card';
  if (q.is_yield) {
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change" style="color:#888888">7d yield</div>';
  } else {
    const change = parseFloat(q.change_pct) || 0;
    const dir = change >= 0 ? 'up' : 'down';
    const arrow = change >= 0 ? '&#9650;' : '&#9660;';
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change ' + dir + '">' + arrow + ' ' + Math.abs(change).toFixed(2) + '%</div>';
  }
  marketBar.appendChild(card);
});

// Build sections in fixed order
const sectionsMap = {};
rawSections.forEach(s => { sectionsMap[s.name] = s; });
const widgetsContainer = document.getElementById('widgets');

sectionOrder.forEach((secName, idx) => {
  const section = sectionsMap[secName] || { name: secName, stories: [] };
  const color = colors[secName] || '#888888';
  const tier = TIER_BY_COLOR[color] || 3;
  const stories = section.stories || [];
  const skipInsight = noInsight.includes(secName);
  const num = String(idx + 1).padStart(2, '0');

  let headlineBullets;
  if (stories.length > 0) {
    headlineBullets = '<ul class="widget-headlines">' +
      stories.map(s => '<li>' + escapeHtml(s.headline) + '</li>').join('') +
    '</ul>';
  } else {
    headlineBullets = '<ul class="widget-headlines"><li>No major stories this cycle</li></ul>';
  }

  const widget = document.createElement('div');
  widget.className = 'widget';
  widget.dataset.tier = tier;

  const header = document.createElement('div');
  header.className = 'widget-header';
  header.innerHTML =
    '<span class="widget-num">' + num + ' &middot;</span>' +
    '<div class="widget-info">' +
      '<div class="widget-title" style="color:' + color + '">' + escapeHtml(secName) + '</div>' +
      headlineBullets +
    '</div>' +
    '<span class="widget-count">' + stories.length + '</span>' +
    '<span class="widget-chevron">&#9656;</span>';
  header.addEventListener('click', () => widget.classList.toggle('active'));

  const body = document.createElement('div');
  body.className = 'widget-body';
  const storiesDiv = document.createElement('div');
  storiesDiv.className = 'widget-stories';

  stories.forEach(story => {
    const storyEl = document.createElement('div');
    storyEl.className = 'story';
    const headlineHtml = escapeHtml(story.headline);
    const sourceHtml = escapeHtml(story.source || '');
    const linkHtml = story.link
      ? '<a class="story-link" href="' + escapeHtml(story.link) + '" target="_blank" rel="noopener">Read source &#8594;</a>'
      : '';
    if (skipInsight) {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        linkHtml;
    } else {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span><span class="arrow">&#9656;</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        '<div class="story-details">' +
          '<div class="story-summary">' + escapeHtml(story.summary || '') + '</div>' +
          '<div class="story-insight">' +
            '<div class="insight-label">Apterreon Insight</div>' +
            escapeHtml(story.insight || '') +
          '</div>' +
          linkHtml +
        '</div>';
      storyEl.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        e.stopPropagation();
        storyEl.classList.toggle('open');
      });
    }
    storiesDiv.appendChild(storyEl);
  });

  body.appendChild(storiesDiv);
  widget.appendChild(header);
  widget.appendChild(body);
  widgetsContainer.appendChild(widget);
});

if (edgeText) {
  document.getElementById('edge').innerHTML =
    '<div class="panel edge"><div class="panel-title">The Edge</div><p>' + escapeHtml(edgeText) + '</p></div>';
}

if (tomorrowText) {
  document.getElementById('tomorrow').innerHTML =
    '<div class="panel"><div class="panel-title">Tomorrow Watch</div><p>' + escapeHtml(tomorrowText) + '</p></div>';
}
</script>
</body>
</html>
