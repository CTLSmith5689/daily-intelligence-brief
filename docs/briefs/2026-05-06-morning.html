  .container { max-width:760px; margin:0 auto; padding:32px 24px 96px; }

  .header { margin-bottom:36px; padding-bottom:24px; border-bottom:1px solid var(--border-dim); }
  .header .tag { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:4px; color:var(--apt-red); text-transform:uppercase; margin-bottom:10px; }

  .header .meta { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-top:10px; }

  .market-bar {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px;
    margin-bottom:32px;
  }
  .market-card {
    background:var(--bg-surface); border:1px solid var(--border-dim);
    padding:14px 12px; text-align:center;
  }
  .market-card .label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .market-card .price { font-family:'DM Mono',monospace; font-size:18px; font-weight:500; color:var(--text-primary); margin:6px 0 4px; }
  .market-card .change { font-family:'DM Mono',monospace; font-size:11px; }
  .market-card .change.up { color:#5599CC; }
  .market-card .change.down { color:var(--apt-red); }

  .usage-banner {

  .usage-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .usage-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; }

  .usage-details { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); }

  .story-source { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; margin-top:6px; }

  .panel p { font-family:'DM Mono',monospace; font-size:13px; color:var(--text-body); line-height:1.7; }

    .widget-header { padding:16px 18px; gap:14px; }

en tariff pain and technological substitution risk; this concentration also creates single-point-of-failure dynamics that U.S. strategists will exploit, raising capex requirements for allied onshoring.", "source": "Information Technology and Innovation Foundation (ITIF)", "link": "https://news.google.com/rss/articles/CBMixgFBVV95cUxOcFRkU09ELXBReXNUb2RjM2NxeDJjdm1xVmJ6V0t0THM3RXYxcVVEMWFjRWR3VU5WdFNoUURGVmVWcFlFVzVpeXFIX2FRLUNQS2xjemNWdTVmZGEzcExyQ0w3Q3BCUlBWcy1BX2xLQ0JCT3FnTzUyOXR6emFUN0dYWWtjTnlkclUySHpQR3o4TEp0MGVjVVZ1eGV4cGZFOEs2S2lmNlpvS2dpTnRuUW5CYVhndjlRNUstSUV3YVlodVd4X3l3MEE?oc=5"}, {"headline": "Pentagon's Botched Blacklist Highlights Frail Trump-Xi Truce", "summary": "A flawed Department of Defense sanctions list targeting Chinese companies revealed execution failures and signaled fragility in the current Trump-Xi diplomatic framework.", "insight": "Botched sanctions implementation exposes gaps in interagency coordination and creates legitimacy problems for future restrictions, which weakens deterrence on Chinese capex expansion and encourages aggressive behavior in ambiguous jurisdictions while the Trump administration recovers from credibility damage.", "source": "Bloomberg.com", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxOSV9aSVk0U1hlWmgzWGIwdkF0aU91MjM2Q04zOUtBNUZKOWdoWm1iel9PYS1lMnBFZ3FiUFNWSXZCS2lNTGNGNU5YcTVkVk5kbWQ4QWpVX1dIV29saEg0N2MzZFdETzRabFVzdnF0TE5TR1NCVThLczVwcFVmVjJMd2xYZDllS2ctMmZ3S3J6NzNrZnN0OTVNSVljUFBmQUJGeEtmNWRuNHdsYUpZdzdrejM3UVZoRDhWd1JXRzhiVDZGS2M?oc=5"}]}, {"name": "Culture & Sports", "stories": [{"headline": "Sony in Talks to Acquire Recognition Music Group In Multibillion Dollar Deal", "summary": "Sony is negotiating to acquire Blackstone's music publishing catalog and artist rights portfolio for approximately $4 billion, consolidating major label ownership of back-catalog IP.", "insight": "Continued consolidation of music IP under major label control reduces upstream optionality for emerging artists and locks in back-catalog economics; this raises the cost of entry for independent distribution and forces newer artists into unequal contracts, creating structural margin compression for non-major players.", "source": "The Hollywood Reporter", "link": "https://news.google.com/rss/articles/CBMivAFBVV95cUxOSE5XNkNEM0hjLXdnOUhtRXlVUDB6NEQ3RnB4SWE2QzN4U2p1VjBjTk00TXJFYVdCcExHRlFPdXNLS0d4TjJ2XzR6V1ZuVnQzbWFVSDhIRG9WeHV6M1ZTRFhrN0lnVGJXUEYwTEI1c1Z4Y0lYQWdSVWsyakxJX3RnWGhGM0FoOVhOUUd0VHZxU2pub2tMUlh3S3JvQU95ZW51cV9NaGpNVVM1ZWdidjdCZmtuTmgtV2RCSWxweg?oc=5"}, {"headline": "NBA playoff schedule, odds, predictions for Knicks vs. 76ers, Spurs vs. Timberwolves", "summary": "NBA playoff matchups pit East contenders and West teams with divergent roster construction profiles, setting up tests of star power versus depth efficiency.", "insight": "Playoff betting markets are pricing conventional star-dependent outcomes, but roster composition asymmetries (defensive efficiency, bench depth) are historically mispriced in short series; allocators betting against the public on depth-driven teams capture consistent alpha.", "source": "CBS Sports", "link": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxObzdPRElEeXN0M2tjM0RZQzFyX2RsWHR4NHhULVFGVUxxNkRZZkdleVh1MUJYakM3NzdtTE1zOEl6eDBoT1hXTk51elc3T2RHUWdPck5jZ1VNYUNEd3pVbi1wdXRwRmY2Mkwxb1IxdDNicUFuejI1eUdpaDhQVmY1cEN5VVQzejBLZ3h0T2ZVdDRxTWQ3dTBEUXVkTTlIZ25ZTVB6bktpR3dEb3NGVjVJeEd1Qm5MdnZCUmVGcnlVZHM?oc=5"}]}, {"name": "Boston", "stories": [{"headline": "MBTA Green Line station closing for 3 years", "summary": "The MBTA announced a multi-year closure of a Green Line station for major infrastructure renovation and modernization work.", "insight": "Extended transit closures in dense urban areas redistribute commuter flows and reveal real estate value shifts toward alternative hubs; three-year closure windows create arbitrage opportunities for commercial real estate in unaffected station zones while compressing valuations in affected corridors.", "source": "NBC Boston", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPbi0xcE9wZWhVYVpoV0p5ellOWVdsbjFkdndJN21HT3EtY0FuVVVzOVE3RXVQSnFPYUlHRDNiOS1lZEFVOGM0Q2tJQnlSWFdCd3RjOFRzR0MtOENZczg2UEdnSG5FNVZTcGZpd1FiN0NKN0twc1k5aU93RHlTc0hMSmpUcTg0OUZJUUNoN1IzX2ttQlnSAZsBQVVfeXFMUDJ1S1BzVFZFa2dnbC1ibmlHTV9xZEFlbHhsaTNLSlRUSGtnRURTbkpLek1PeVJJcGpISFlPOG9YV0VqR08zaTZSUnRlblBtMUdTUDhjUldFcGdPWGRkNVFuQVdaTzY1NExRd0tIU2VDODlDcDREU0t4QWJpcVU2endLbThPMy1GS2Vtc2hKTFR2Z0JmbGNEbjZfVjQ?oc=5"}, {"headline": "'Remembered as a hero': Trooper killed in crash with wrong-way driver", "summary": "Massachusetts State Police trooper died in a collision with a wrong-way driver on an interstate, prompting statements of condolence from state officials.", "insight": "This is a localized incident with no systemic market implications.", "source": "WCVB", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxOTkF3MUhnMmYzSHpXWW9iNVlBQUg2cUpKb0VNclNhQWJ4Z21UclZHYXczSmttMjNtWGtTbTc1MHc3Y1YxUTIwcDVxV1pJM3pDT1hMelVURllYdXR1ZW10VGZub0dZenlBNEJIZ2hfWlJRbTZuSnUyUjBYOVd2YmlSQ00tZzNQRnNlc1E?oc=5"}]}];
const edgeText = "Peace deal optionality in Middle East collapses oil geopolitical premiums while simultaneously weakening bipartisan spending consensus, creating divergent capital allocation flows: energy equity repricing meets reduced foreign aid lock-in, freeing domestic spending for infrastructure and AI capex. Meanwhile, China's 25% share of advanced manufacturing becomes leverage point in any Trump negotiation, forcing allied onshoring that will sustain capex intensity regardless of cycle downturn.";
const tomorrowText = "";
const colors = {"Breaking News": "#CC0000", "Finance & Markets": "#CC0000", "Politics & Policy": "#7A1010", "AI & Technology": "#7A1010", "International": "#888888", "Culture & Sports": "#888888", "Boston": "#888888"};
const quotes = [{"ticker": "SPY", "label": "S&P 500", "price": "733.83", "change_pct": "1.3899"}, {"ticker": "IWB", "label": "Russell 1000", "price": "400.98", "change_pct": "1.4087"}, {"ticker": "IWM", "label": "Russell 2000", "price": "286.80", "change_pct": "1.5006"}, {"ticker": "EFA", "label": "MSCI EAFE", "price": "104.81", "change_pct": "2.7146"}, {"ticker": "FFR", "label": "MM Yield (avg)", "price": "3.64%", "change_pct": "0", "is_yield": true}];
const sectionOrder = ["Breaking News", "Finance & Markets", "Politics & Policy", "AI & Technology", "International", "Culture & Sports", "Boston"];
const noInsight = ["Breaking News"];

const TIER_BY_COLOR = { '#CC0000':1, '#7A1010':2, '#888888':3 };

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}

// Usage banner
if (usageInfo && usageInfo.cost_monthly_projected !== undefined) {
  const monthly = usageInfo.cost_monthly_projected;
  const cost = usageInfo.cost_this_call || 0;
  const tokens = usageInfo.total_tokens || 0;
  const budget = 10.0;
  const pct = Math.min(100, (monthly / budget) * 100);
  let barColor, status;
  if (monthly < 2)      { barColor = '#5599CC'; status = 'LOW'; }
  else if (monthly < 5) { barColor = '#888888'; status = 'MODERATE'; }
  else                  { barColor = '#CC0000'; status = 'HIGH'; }

  document.getElementById('usage').innerHTML =
    '<div class="usage-banner">' +
      '<div class="usage-row">' +
        '<span class="usage-label">API Usage</span>' +
        '<span class="usage-status" style="color:' + barColor + '">' + status + '</span>' +
      '</div>' +
      '<div class="usage-bar"><div class="usage-bar-fill" style="background:' + barColor + ';width:' + pct.toFixed(0) + '%"></div></div>' +
      '<div class="usage-details">$' + cost.toFixed(4) + ' this brief &middot; ' + tokens.toLocaleString() + ' tokens &middot; $' + monthly.toFixed(2) + '/mo projected &middot; $10.00 budget</div>' +
    '</div>';
}

// Market bar
const marketBar = document.getElementById('market-bar');
quotes.forEach(q => {
  const card = document.createElement('div');
  card.className = 'market-card';
  if (q.is_yield) {
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change" style="color:#888888">7d yield</div>';
  } else {
    const change = parseFloat(q.change_pct) || 0;
    const dir = change >= 0 ? 'up' : 'down';
    const arrow = change >= 0 ? '&#9650;' : '&#9660;';
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change ' + dir + '">' + arrow + ' ' + Math.abs(change).toFixed(2) + '%</div>';
  }
  marketBar.appendChild(card);
});

// Build sections in fixed order
const sectionsMap = {};
rawSections.forEach(s => { sectionsMap[s.name] = s; });
const widgetsContainer = document.getElementById('widgets');

sectionOrder.forEach((secName, idx) => {
  const section = sectionsMap[secName] || { name: secName, stories: [] };
  const color = colors[secName] || '#888888';
  const tier = TIER_BY_COLOR[color] || 3;
  const stories = section.stories || [];
  const skipInsight = noInsight.includes(secName);
  const num = String(idx + 1).padStart(2, '0');

  let headlineBullets;
  if (stories.length > 0) {
    headlineBullets = '<ul class="widget-headlines">' +
      stories.map(s => '<li>' + escapeHtml(s.headline) + '</li>').join('') +
    '</ul>';
  } else {
    headlineBullets = '<ul class="widget-headlines"><li>No major stories this cycle</li></ul>';
  }

  const widget = document.createElement('div');
  widget.className = 'widget';
  widget.dataset.tier = tier;

  const header = document.createElement('div');
  header.className = 'widget-header';
  header.innerHTML =
    '<span class="widget-num">' + num + ' &middot;</span>' +
    '<div class="widget-info">' +
      '<div class="widget-title" style="color:' + color + '">' + escapeHtml(secName) + '</div>' +
      headlineBullets +
    '</div>' +
    '<span class="widget-count">' + stories.length + '</span>' +
    '<span class="widget-chevron">&#9656;</span>';
  header.addEventListener('click', () => widget.classList.toggle('active'));

  const body = document.createElement('div');
  body.className = 'widget-body';
  const storiesDiv = document.createElement('div');
  storiesDiv.className = 'widget-stories';

  stories.forEach(story => {
    const storyEl = document.createElement('div');
    storyEl.className = 'story';
    const headlineHtml = escapeHtml(story.headline);
    const sourceHtml = escapeHtml(story.source || '');
    const linkHtml = story.link
      ? '<a class="story-link" href="' + escapeHtml(story.link) + '" target="_blank" rel="noopener">Read source &#8594;</a>'
      : '';
    if (skipInsight) {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        linkHtml;
    } else {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span><span class="arrow">&#9656;</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        '<div class="story-details">' +
          '<div class="story-summary">' + escapeHtml(story.summary || '') + '</div>' +
          '<div class="story-insight">' +
            '<div class="insight-label">Apterreon Insight</div>' +
            escapeHtml(story.insight || '') +
          '</div>' +
          linkHtml +
        '</div>';
      storyEl.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        e.stopPropagation();
        storyEl.classList.toggle('open');
      });
    }
    storiesDiv.appendChild(storyEl);
  });

  body.appendChild(storiesDiv);
  widget.appendChild(header);
  widget.appendChild(body);
  widgetsContainer.appendChild(widget);
});

if (edgeText) {
  document.getElementById('edge').innerHTML =
    '<div class="panel edge"><div class="panel-title">The Edge</div><p>' + escapeHtml(edgeText) + '</p></div>';
}

if (tomorrowText) {
  document.getElementById('tomorrow').innerHTML =
    '<div class="panel"><div class="panel-title">Tomorrow Watch</div><p>' + escapeHtml(tomorrowText) + '</p></div>';
}
</script>
</body>
</html>
