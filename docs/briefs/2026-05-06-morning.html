ssets.", "insight": "Whether the number is accurate or propaganda, it signals China's willingness to quantify and weaponize decoupling costs. This shifts negotiation leverage: EU members in lower GDP categories face political resistance to $400B sunk costs. Watch for EU fracturing along national lines as peripheral economies defect or demand side payments. Winners: U.S. chip and equipment firms gaining EU market share; losers: EU industrial firms in automotive and machinery losing Chinese supply cost advantages.", "source": "Reuters", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxQM256QnRGWVdJclZYWUxDdmZucUlxVExkTTlUOHh3Rlk4MWVBY3kzSGV3TFFndHRXdEJEZ2E0amwwQkQ0c0FJV2psbmpMZGQ2dlkxUlBHbzNBS25NZ210NTk5TFpzc201YkViOEF3SUN2UGN6eFZGZkZtV0tyeklfMVMxTWhfUTIzMFpTSEI1ekhFVXZhMzd0REpKeEt6TzdIRXpzMUwzUkwwR0Y0NTZDOHFDdmJUSHFSREFYRW03eEYxSTA?oc=5"}, {"headline": "U.S. and China Pursue Guardrails to Stop AI Rivalry From Spiraling Into Crisis", "summary": "U.S. and China initiated diplomatic talks to establish protocols and communication channels preventing accidental escalation in AI military competition.", "insight": "Guardrail frameworks are admission that AI competition is now existential. However, verification is nearly impossible: model weights and training data are unobservable. Real agreements will likely focus on military deployment and use-case restrictions rather than capability development. The asymmetry: U.S. leads in frontier models, China in manufacturing and integration. Expect agreements to freeze relative positioning, not reduce absolute competition. This favors incumbent advantage holders.", "source": "WSJ", "link": "https://news.google.com/rss/articles/CBMiugFBVV95cUxOOWRzdlNYRnJndmpPLXFNZ2JoZUlkSkxCY2JBQXZBS3ZkNGV3dkt0aGkyY0JjWThDTDA1RUh3b3J3Tm1WcnFiYjVrUXZUZG5PTVBRcWR6T3o5RmlXVGhlVjJ6QnlCTUNhNWdLcDNxYy1CcGJNMTU4Y28tbVVqY0REdndfdkdOUG5SRkpsWVpmTTFpaEE2RGtlOXNkS2hDOUJQbTdDa0tWek9zU3ZGeDJabXptSUw3dzBadEE?oc=5"}]}, {"name": "Culture & Sports", "stories": [{"headline": "Sony in Talks to Acquire Recognition Music Group In Multibillion Dollar Deal", "summary": "Sony Music is negotiating to acquire Recognition Music Group, a catalog holding company, for a multibillion dollar valuation.", "insight": "Music IP remains a capital sink for legacy media. Sony is doubling down on catalog ownership during high interest rate environment, betting on discounted future royalty streams. This signals confidence in streaming margins but reveals concern about direct-to-creator platforms eroding label intermediation. Winners: catalog holders selling now at peak valuations before talent defection accelerates.", "source": "The Hollywood Reporter", "link": "https://news.google.com/rss/articles/CBMivAFBVV95cUxOSE5XNkNEM0hjLXdnOUhtRXlVUDB6NEQ3RnB4SWE2QzN4U2p1VjBjTk00TXJFYVdCcExHRlFPdXNLS0d4TjJ2XzR6V1ZuVnQzbWFVSDhIRG9WeHV6M1ZTRFhrN0lnVGJXUEYwTEI1c1Z4Y0lYQWdSVWsyakxJX3RnWGhGM0FoOVhOUUd0VHZxU2pub2tMUlh3S3JvQU95ZW51cV9NaGpNVVM1ZWdidjdCZmtuTmgtV2RCSWxweg?oc=5"}, {"headline": "NBA playoff schedule, odds, predictions for Knicks vs. 76ers, Spurs vs. Timberwolves", "summary": "NBA playoff matchups are underway with games scheduled between Eastern Conference teams and Western Conference contenders.", "insight": "Sports betting volume and algorithmic trading on player performance metrics are now material to broadcast distribution deals and sponsorship valuations. Playoff performance data feeds into next year's salary arbitrage for agents and teams. Watch for players with unusual betting patterns or performance clusters that suggest algorithm training.", "source": "CBS Sports", "link": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxObzdPRElEeXN0M2tjM0RZQzFyX2RsWHR4NHhULVFGVUxxNkRZZkdleVh1MUJYakM3NzdtTE1zOEl6eDBoT1hXTk51elc3T2RHUWdPck5jZ1VNYUNEd3pVbi1wdXRwRmY2Mkwxb1IxdDNicUFuejI1eUdpaDhQVmY1cEN5VVQzejBLZ3h0T2ZVdDRxTWQ3dTBEUXVkTTlIZ25ZTVB6bktpR3dEb3NGVjVJeEd1Qm5MdnZCUmVGcnlVZHM?oc=5"}]}, {"name": "Boston", "stories": [{"headline": "MBTA Green Line station closing for 3 years", "summary": "The MBTA announced a multiyear closure of a Green Line station for major capital renovations affecting regional commuting patterns.", "insight": "Extended transit outages create real estate arbitrage opportunities: property values shift away from closed station zones, benefiting alternate corridors. Local businesses face temporary demand destruction. Watch for institutional real estate players acquiring distressed property in closure zones ahead of reopening.", "source": "NBC Boston", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPbi0xcE9wZWhVYVpoV0p5ellOWVdsbjFkdndJN21HT3EtY0FuVVVzOVE3RXVQSnFPYUlHRDNiOS1lZEFVOGM0Q2tJQnlSWFdCd3RjOFRzR0MtOENZczg2UEdnSG5FNVZTcGZpd1FiN0NKN0twc1k5aU93RHlTc0hMSmpUcTg0OUZJUUNoN1IzX2ttQlnSAZsBQVVfeXFMUDJ1S1BzVFZFa2dnbC1ibmlHTV9xZEFlbHhsaTNLSlRUSGtnRURTbkpLek1PeVJJcGpISFlPOG9YV0VqR08zaTZSUnRlblBtMUdTUDhjUldFcGdPWGRkNVFuQVdaTzY1NExRd0tIU2VDODlDcDREU0t4QWJpcVU2endLbThPMy1GS2Vtc2hKTFR2Z0JmbGNEbjZfVjQ?oc=5"}, {"headline": "Watch: Dignified transfer held for fallen Mass. State Police Trooper Kevin Trainor", "summary": "Massachusetts State Police conducted a formal ceremony honoring Trooper Kevin Trainor, killed in a collision with a wrong-way driver.", "insight": "Low signal for markets but relevant to traffic safety infrastructure spending: fatality data drives public safety budgets and law enforcement allocation. Increased wrong-way incidents may accelerate highway tech adoption (guardrails, signage), creating capex demand for construction and transportation safety vendors.", "source": "Boston 25 News", "link": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxNUXZkYy1fMnA0YXhPZ3RwSE53YVdUQ2ZKZ2hSaXBtNzNmTFMzU19aN0lnOVdRRjFVZFBlVnFSb0tVQWMyZjRPWG8yUldQRUs3Y21TSHN6X3JHd1hUYjNRbWZvRHJpYldtVTJfaWRmVERSM1BDRHBDNGJFX1NNZU5BS05aWndyeVY4YXlvS3EjeUZZZWlpbnJyOEJXUGNkUm8yZDlkZnRKb0I4NEdBbUtYWUtFdnZFaHdpN2hDdVNDVUstWG4yOGp5UmM3Y1JEZ2NQZnRvQjFxcVJOTmdJ0gHwAUFVX3lxTE5MRVRlWTJNekZTaGVaaFc3YXlw const edgeText = "Three dynamics are colliding: energy transition (TSMC wind power securing AI chip supply), geopolitical risk unwind (Middle East deal pricing), and AI infrastructure consolidation (Anthropic escaping cloud vendor dependency via SpaceX). Winners are those with direct access to critical inputs (renewable energy, satellite compute, rare earth processing) outside traditional hyperscaler control. The arbitrage window is closing as every frontier lab realizes vendor lock-in is existential risk.";
const tomorrowText = "";
const colors = {"Breaking News": "#CC0000", "Finance & Markets": "#CC0000", "Politics & Policy": "#7A1010", "AI & Technology": "#7A1010", "International": "#888888", "Culture & Sports": "#888888", "Boston": "#888888"};
const quotes = [{"ticker": "SPY", "label": "S&P 500", "price": "733.83", "change_pct": "1.3899"}, {"ticker": "IWB", "label": "Russell 1000", "price": "400.98", "change_pct": "1.4087"}, {"ticker": "IWM", "label": "Russell 2000", "price": "286.80", "change_pct": "1.5006"}, {"ticker": "EFA", "label": "MSCI EAFE", "price": "104.81", "change_pct": "2.7146"}, {"ticker": "FFR", "label": "MM Yield (avg)", "price": "3.64%", "change_pct": "0", "is_yield": true}];
const sectionOrder = ["Breaking News", "Finance & Markets", "Politics & Policy", "AI & Technology", "International", "Culture & Sports", "Boston"];
const noInsight = ["Breaking News"];

const TIER_BY_COLOR = { '#CC0000':1, '#7A1010':2, '#888888':3 };

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}

// Usage banner
if (usageInfo && usageInfo.cost_monthly_projected !== undefined) {
  const monthly = usageInfo.cost_monthly_projected;
  const cost = usageInfo.cost_this_call || 0;
  const tokens = usageInfo.total_tokens || 0;
  const budget = 10.0;
  const pct = Math.min(100, (monthly / budget) * 100);
  let barColor, status;
  if (monthly < 2)      { barColor = '#5599CC'; status = 'LOW'; }
  else if (monthly < 5) { barColor = '#888888'; status = 'MODERATE'; }
  else                  { barColor = '#CC0000'; status = 'HIGH'; }

  document.getElementById('usage').innerHTML =
    '<div class="usage-banner">' +
      '<div class="usage-row">' +
        '<span class="usage-label">API Usage</span>' +
        '<span class="usage-status" style="color:' + barColor + '">' + status + '</span>' +
      '</div>' +
      '<div class="usage-bar"><div class="usage-bar-fill" style="background:' + barColor + ';width:' + pct.toFixed(0) + '%"></div></div>' +
      '<div class="usage-details">$' + cost.toFixed(4) + ' this brief &middot; ' + tokens.toLocaleString() + ' tokens &middot; $' + monthly.toFixed(2) + '/mo projected &middot; $10.00 budget</div>' +
    '</div>';
}

// Market bar
const marketBar = document.getElementById('market-bar');
quotes.forEach(q => {
  const card = document.createElement('div');
  card.className = 'market-card';
  if (q.is_yield) {
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change" style="color:#888888">7d yield</div>';
  } else {
    const change = parseFloat(q.change_pct) || 0;
    const dir = change >= 0 ? 'up' : 'down';
    const arrow = change >= 0 ? '&#9650;' : '&#9660;';
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change ' + dir + '">' + arrow + ' ' + Math.abs(change).toFixed(2) + '%</div>';
  }
  marketBar.appendChild(card);
});

// Build sections in fixed order
const sectionsMap = {};
rawSections.forEach(s => { sectionsMap[s.name] = s; });
const widgetsContainer = document.getElementById('widgets');

sectionOrder.forEach((secName, idx) => {
  const section = sectionsMap[secName] || { name: secName, stories: [] };
  const color = colors[secName] || '#888888';
  const tier = TIER_BY_COLOR[color] || 3;
  const stories = section.stories || [];
  const skipInsight = noInsight.includes(secName);
  const num = String(idx + 1).padStart(2, '0');

  let headlineBullets;
  if (stories.length > 0) {
    headlineBullets = '<ul class="widget-headlines">' +
      stories.map(s => '<li>' + escapeHtml(s.headline) + '</li>').join('') +
    '</ul>';
  } else {
    headlineBullets = '<ul class="widget-headlines"><li>No major stories this cycle</li></ul>';
  }

  const widget = document.createElement('div');
  widget.className = 'widget';
  widget.dataset.tier = tier;

  const header = document.createElement('div');
  header.className = 'widget-header';
  header.innerHTML =
    '<span class="widget-num">' + num + ' &middot;</span>' +
    '<div class="widget-info">' +
      '<div class="widget-title" style="color:' + color + '">' + escapeHtml(secName) + '</div>' +
      headlineBullets +
    '</div>' +
    '<span class="widget-count">' + stories.length + '</span>' +
    '<span class="widget-chevron">&#9656;</span>';
  header.addEventListener('click', () => widget.classList.toggle('active'));

  const body = document.createElement('div');
  body.className = 'widget-body';
  const storiesDiv = document.createElement('div');
  storiesDiv.className = 'widget-stories';

  stories.forEach(story => {
    const storyEl = document.createElement('div');
    storyEl.className = 'story';
    const headlineHtml = escapeHtml(story.headline);
    const sourceHtml = escapeHtml(story.source || '');
    const linkHtml = story.link
      ? '<a class="story-link" href="' + escapeHtml(story.link) + '" target="_blank" rel="noopener">Read source &#8594;</a>'
      : '';
    if (skipInsight) {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        linkHtml;
    } else {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span><span class="arrow">&#9656;</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        '<div class="story-details">' +
          '<div class="story-summary">' + escapeHtml(story.summary || '') + '</div>' +
          '<div class="story-insight">' +
            '<div class="insight-label">Apterreon Insight</div>' +
            escapeHtml(story.insight || '') +
          '</div>' +
          linkHtml +
        '</div>';
      storyEl.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        e.stopPropagation();
        storyEl.classList.toggle('open');
      });
    }
    storiesDiv.appendChild(storyEl);
  });

  body.appendChild(storiesDiv);
  widget.appendChild(header);
  widget.appendChild(body);
  widgetsContainer.appendChild(widget);
});

if (edgeText) {
  document.getElementById('edge').innerHTML =
    '<div class="panel edge"><div class="panel-title">The Edge</div><p>' + escapeHtml(edgeText) + '</p></div>';
}

if (tomorrowText) {
  document.getElementById('tomorrow').innerHTML =
    '<div class="panel"><div class="panel-title">Tomorrow Watch</div><p>' + escapeHtml(tomorrowText) + '</p></div>';
}
</script>
</body>
