he Hollywood Reporter", "link": "https://news.google.com/rss/articles/CBMivAFBVV95cUxOSE5XNkNEM0hjLXdnOUhtRXlVUDB6NEQ3RnB4SWE2QzN4U2p1VjBjTk00TXJFYVdCcExHRlFPdXNLS0d4TjJ2XzR6V1ZuVnQzbWFVSDhIRG9WeHV6M1ZTRFhrN0lnVGJXUEYwTEI1c1Z4Y0lYQWdSVWsyakxJX3RnWGhGM0FoOVhOUUd0VHZxU2pub2tMUlh3S3JvQU95ZW51cV9NaGpNVVM1ZWdidjdCZmtuTmgtV2RCSWxweg?oc=5"}, {"headline": "NBA playoff TV schedule tonight, where to watch games, stream, times", "summary": "NBA released broadcast schedule and streaming details for tonight's playoff matchups across multiple networks and platforms.", "insight": "Fragmented media distribution of premium sports content across linear, streaming, and regional channels reduces absolute audience reach per game while forcing allocators to pay across multiple bundles: this pressure tests broadcaster margin models and accelerates audience migration to aggregator platforms, transferring pricing power from content creators to distribution gatekeepers.", "source": "Milwaukee Journal Sentinel", "link": "https://news.google.com/rss/articles/CBMixgFBVV95cUxNcVNOWTFuSFhkYWlxMDFJUWJNRUFXTmJUbkdGMUdFSG5UbzFCYmRDcjFkYjdHdlVwYzc0ci1GZDlrTlE3eFRHYUxlMGhMQWNQVlFJci1qdlBIMjJzZVN2TUJjNlVfSmkzbkExRkpMODV6aF9OcU1aWkhHdExhY2lTWWZaZk53MmgwM3dWNHk5eE1aZDdOemJBdUZ2UUZCMThGY29tRXpVWEdoUmRfRWVHYkFkRzRVM244bzdMU19QLWtUV0Q4aFE?oc=5"}]}, {"name": "Boston", "stories": [{"headline": "MBTA Green Line station closing for 3 years", "summary": "The Massachusetts Bay Transportation Authority announced a three-year closure of a Green Line station for capital repairs and infrastructure modernization.", "insight": "Long-duration transit infrastructure outages in high-density urban corridors create persistent commute friction and accelerate remote work adoption in affected zones: this suppresses real estate values in dependent corridors and shifts demand to car-dependent neighborhoods, fragmenting the regional labor market and eroding transit-oriented development ROI.", "source": "NBC Boston", "link": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPbi0xcE9wZWhVYVpoV0p5ellOWVdsbjFkdndJN21HT3EtY0FuVVVzOVE3RXVQSnFPYUlHRDNiOS1lZEFVOGM0Q2tJQnlSWFdCd3RjOFRzR0MtOENZczg2UEdnSG5FNVZTcGZpd1FiN0NKN0twc1k5aU93RHlTc0hMSmpUcTg0OUZJUUNoN1IzX2ttQlnSAZsBQVVfeXFMUDJ1S1BzVFZFa2dnbC1ibmlHTV9xZEFlbHhsaTNLSlRUSGtnRURTbkpLek1PeVJJcGpISFlPOG9YV0VqR08zaTZSUnRlblBtMUdTUDhjUldFcGdPWGRkNVFuQVdaTzY1NExRd0tIU2VDODlDcDREU0t4QWJpcVU2endLbThPMy1GS2Vtc2hKTFR2Z0JmbGNEbjZfVjQ?oc=5"}, {"headline": "Trooper killed in crash with wrong-way driver", "summary": "A Massachusetts State Police trooper was fatally struck by a wrong-way driver on a highway, sparking investigation into vehicle operation safeguards.", "insight": "Infrastructure gap in wrong-way detection systems (median breaches, directional signage enforcement) exposes liability for state DOT and creates procurement opportunity for autonomous detection vendors: this accelerates deployment of edge sensors at high-accident corridors and creates data moat for insurance underwriters assessing crash risk by geography.", "source": "WCVB", "link": "https://news.google.com/rss/articles/CBMiigFBVV95cUxOTkF3MUhnMmYzSHpXWW9iNVlBQUg2cUpKb0VNclNhQWJ4Z21UclZHYXczSmttMjNtWGtTbTc1MHc3Y1YxUTIwcDVxV1pJM3pDT1hMelVURllYdXR1ZW10VGZub0dZenlBNEJIZ2hfWlJRbTZuSnUyUjBYOVd2YmlSQ00tZzNQRnNlc1E?oc=5"}]}];
const edgeText = "Geopolitical de-escalation on Middle East (Hormuz agreement, China mediation) creates simultaneous benefits and constraints: energy price relief improves equity duration and lower-income consumption, but forces Trump to either reward Beijing diplomatically (Taiwan concessions) or accept continued escalation (inflation persistence). The administration cannot optimize both simultaneously, making this a true strategic trilemma where capital allocators must position for which horn gets chosen, as each choice cascades through different asset classes with 90-180 day lags.";
const tomorrowText = "";
const colors = {"Breaking News": "#CC0000", "Finance & Markets": "#CC0000", "Politics & Policy": "#7A1010", "AI & Technology": "#7A1010", "International": "#888888", "Culture & Sports": "#888888", "Boston": "#888888"};
const quotes = [{"ticker": "SPY", "label": "S&P 500", "price": "733.83", "change_pct": "1.3899"}, {"ticker": "IWB", "label": "Russell 1000", "price": "400.98", "change_pct": "1.4087"}, {"ticker": "IWM", "label": "Russell 2000", "price": "286.80", "change_pct": "1.5006"}, {"ticker": "EFA", "label": "MSCI EAFE", "price": "104.81", "change_pct": "2.7146"}, {"ticker": "FFR", "label": "MM Yield (avg)", "price": "3.64%", "change_pct": "0", "is_yield": true}];
const sectionOrder = ["Breaking News", "Finance & Markets", "Politics & Policy", "AI & Technology", "International", "Culture & Sports", "Boston"];
const noInsight = ["Breaking News"];

const TIER_BY_COLOR = { '#CC0000':1, '#7A1010':2, '#888888':3 };

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
}

// Usage banner
if (usageInfo && usageInfo.cost_monthly_projected !== undefined) {
  const monthly = usageInfo.cost_monthly_projected;
  const cost = usageInfo.cost_this_call || 0;
  const tokens = usageInfo.total_tokens || 0;
  const budget = 10.0;
  const pct = Math.min(100, (monthly / budget) * 100);
  let barColor, status;
  if (monthly < 2)      { barColor = '#5599CC'; status = 'LOW'; }
  else if (monthly < 5) { barColor = '#888888'; status = 'MODERATE'; }
  else                  { barColor = '#CC0000'; status = 'HIGH'; }

  document.getElementById('usage').innerHTML =
    '<div class="usage-banner">' +
      '<div class="usage-row">' +
        '<span class="usage-label">API Usage</span>' +
        '<span class="usage-status" style="color:' + barColor + '">' + status + '</span>' +
      '</div>' +
      '<div class="usage-bar"><div class="usage-bar-fill" style="background:' + barColor + ';width:' + pct.toFixed(0) + '%"></div></div>' +
      '<div class="usage-details">$' + cost.toFixed(4) + ' this brief &middot; ' + tokens.toLocaleString() + ' tokens &middot; $' + monthly.toFixed(2) + '/mo projected &middot; $10.00 budget</div>' +
    '</div>';
}

// Market bar
const marketBar = document.getElementById('market-bar');
quotes.forEach(q => {
  const card = document.createElement('div');
  card.className = 'market-card';
  if (q.is_yield) {
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change" style="color:#888888">7d yield</div>';
  } else {
    const change = parseFloat(q.change_pct) || 0;
    const dir = change >= 0 ? 'up' : 'down';
    const arrow = change >= 0 ? '&#9650;' : '&#9660;';
    card.innerHTML =
      '<div class="label">' + escapeHtml(q.label) + '</div>' +
      '<div class="price">' + escapeHtml(q.price) + '</div>' +
      '<div class="change ' + dir + '">' + arrow + ' ' + Math.abs(change).toFixed(2) + '%</div>';
  }
  marketBar.appendChild(card);
});

// Build sections in fixed order
const sectionsMap = {};
rawSections.forEach(s => { sectionsMap[s.name] = s; });
const widgetsContainer = document.getElementById('widgets');

sectionOrder.forEach((secName, idx) => {
  const section = sectionsMap[secName] || { name: secName, stories: [] };
  const color = colors[secName] || '#888888';
  const tier = TIER_BY_COLOR[color] || 3;
  const stories = section.stories || [];
  const skipInsight = noInsight.includes(secName);
  const num = String(idx + 1).padStart(2, '0');

  let headlineBullets;
  if (stories.length > 0) {
    headlineBullets = '<ul class="widget-headlines">' +
      stories.map(s => '<li>' + escapeHtml(s.headline) + '</li>').join('') +
    '</ul>';
  } else {
    headlineBullets = '<ul class="widget-headlines"><li>No major stories this cycle</li></ul>';
  }

  const widget = document.createElement('div');
  widget.className = 'widget';
  widget.dataset.tier = tier;

  const header = document.createElement('div');
  header.className = 'widget-header';
  header.innerHTML =
    '<span class="widget-num">' + num + ' &middot;</span>' +
    '<div class="widget-info">' +
      '<div class="widget-title" style="color:' + color + '">' + escapeHtml(secName) + '</div>' +
      headlineBullets +
    '</div>' +
    '<span class="widget-count">' + stories.length + '</span>' +
    '<span class="widget-chevron">&#9656;</span>';
  header.addEventListener('click', () => widget.classList.toggle('active'));

  const body = document.createElement('div');
  body.className = 'widget-body';
  const storiesDiv = document.createElement('div');
  storiesDiv.className = 'widget-stories';

  stories.forEach(story => {
    const storyEl = document.createElement('div');
    storyEl.className = 'story';
    const headlineHtml = escapeHtml(story.headline);
    const sourceHtml = escapeHtml(story.source || '');
    const linkHtml = story.link
      ? '<a class="story-link" href="' + escapeHtml(story.link) + '" target="_blank" rel="noopener">Read source &#8594;</a>'
      : '';
    if (skipInsight) {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        linkHtml;
    } else {
      storyEl.innerHTML =
        '<div class="story-headline"><span>' + headlineHtml + '</span><span class="arrow">&#9656;</span></div>' +
        '<div class="story-source">' + sourceHtml + '</div>' +
        '<div class="story-details">' +
          '<div class="story-summary">' + escapeHtml(story.summary || '') + '</div>' +
          '<div class="story-insight">' +
            '<div class="insight-label">Apterreon Insight</div>' +
            escapeHtml(story.insight || '') +
          '</div>' +
          linkHtml +
        '</div>';
      storyEl.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        e.stopPropagation();
        storyEl.classList.toggle('open');
      });
    }
    storiesDiv.appendChild(storyEl);
  });

  body.appendChild(storiesDiv);
  widget.appendChild(header);
  widget.appendChild(body);
  widgetsContainer.appendChild(widget);
});

if (edgeText) {
  document.getElementById('edge').innerHTML =
    '<div class="panel edge"><div class="panel-title">The Edge</div><p>' + escapeHtml(edgeText) + '</p></div>';
}

if (tomorrowText) {
  document.getElementById('tomorrow').innerHTML =
    '<div class="panel"><div class="panel-title">Tomorrow Watch</div><p>' + escapeHtml(tomorrowText) + '</p></div>';
}
</script>
</body>
</html>
