## Warns before GitHub's 60-day inactivity disable.
##
## GitHub disables a repository's scheduled workflows after 60 days with no
## repository activity. On 2026-07-07 that is exactly what killed this project:
## the last human commit was 2026-05-07 and the schedule went to
## disabled_inactivity 61 days later. The brief's own daily commits did NOT reset
## the timer, because pushes made with the built-in GITHUB_TOKEN do not count.
##
## The obvious fix is a PAT that pushes an empty commit monthly. This does not do
## that, deliberately: a long-lived write credential sitting in repo secrets is a
## standing liability, and it only exists to fake activity the owner could supply
## with one real commit. So instead this warns while there is still time to act.
##
## It needs no new secret. It reuses the SMTP password already here for failure
## alerts, and reads history with the built-in token.
##
## This workflow is itself a scheduled workflow, so it is subject to the same
## disable it warns about.
##
## It runs weekly, not monthly. A monthly run can only warn if one of its
## firings happens to land with the age between 40 and 60 days, which is a
## 20-day window sampled at a 28-31 day stride, so the stride steps clean over
## it. Simulated across all 365 possible last-commit dates in 2026: the monthly
## schedule never warned at all for 113 of them (31%), and where it did warn the
## notice was sometimes zero days. Weekly misses none of them and never gives
## less than 14 days.

name: keepalive-check

on:
  schedule:
    - cron: '0 12 * * 1'   # 12:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need real history to find the last human commit

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Warn if the inactivity clock is running down
        env:
          APTERREON_ICLOUD_APP_PASSWORD: ${{ secrets.APTERREON_ICLOUD_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python - <<'PY'
          import subprocess, datetime, os, sys

          # Commits pushed by the workflow itself do not count as repository
          # activity, so find the newest commit that is not the bot's.
          BOT = "actions@users.noreply.github.com"
          WARN_AFTER_DAYS = 40
          DISABLE_AT_DAYS = 60

          log = subprocess.run(["git", "log", "--format=%cI|%ae"],
                               capture_output=True, text=True, check=True).stdout

          last = None
          for line in log.splitlines():
              when, _, email = line.partition("|")
              if email.strip().lower() != BOT:
                  last = (when, email.strip())
                  break

          if not last:
              print("No non-bot commit found in history; nothing to compare against.")
              sys.exit(0)

          when, email = last
          age = (datetime.datetime.now(datetime.timezone.utc)
                 - datetime.datetime.fromisoformat(when)).days
          print(f"Last human commit: {when} by {email} ({age} days ago)")

          if age < WARN_AFTER_DAYS:
              print(f"Under the {WARN_AFTER_DAYS}-day threshold, no warning needed.")
              sys.exit(0)

          left = DISABLE_AT_DAYS - age
          repo = os.environ["REPO_URL"]
          from lambda_function import send_email
          send_email(
              f"apterreon-brief: schedule stops in ~{left} days",
              "<h2>Push any commit to keep the pipeline running.</h2>"
              f"<p>The last commit that was not from the workflow bot was "
              f"<b>{age} days ago</b> ({when}).</p>"
              "<p>GitHub disables scheduled workflows after 60 days with no human "
              "repository activity. The pipeline's own commits do not reset that "
              "timer, so without a real commit the hourly and daily runs will stop "
              "silently, exactly as they did on 2026-07-07.</p>"
              "<p>Any commit resets the clock. An empty one is enough:</p>"
              "<pre>git commit --allow-empty -m keepalive &amp;&amp; git push</pre>"
              f'<p><a href="{repo}">{repo}</a></p>',
          )
          print(f"Warning sent: {age} days since the last human commit.")
          PY

      # Without this the keepalive can fail silently. It runs weekly and does
      # nothing but send mail, so a revoked app-specific password would go
      # unnoticed until the week it was needed, which is the week the schedule
      # is about to be disabled.
      - name: Alert if the keepalive itself failed
        if: failure() || cancelled()
        env:
          APTERREON_ICLOUD_APP_PASSWORD: ${{ secrets.APTERREON_ICLOUD_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from lambda_function import send_email
          send_email(
              "apterreon keepalive check FAILED",
              "<h2>The inactivity warning did not run.</h2>"
              "<p>This is the check that tells you before GitHub disables the "
              "schedule after 60 days without a human commit. While it is broken "
              "you have no warning that the pipeline is about to stop.</p>"
              f'<p><a href="{os.environ["RUN_URL"]}">Open the failed run</a></p>',
          )
          print("Keepalive failure alert sent.")
          PY
