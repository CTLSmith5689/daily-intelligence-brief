name: apterreon-brief

# Two cadences, because the cheap part and the expensive part move at different
# speeds. The hourly "record" run appends quotes and new headlines to the CSVs
# and finishes in well under a minute. The daily run additionally refreshes the
# ~2,900-ticker fundamentals panel and rebuilds the site, which rewrites a ~325KB
# index.html; doing that hourly would bloat the repo for no new information.
#
# Both crons run at :23, never on the hour. GitHub's own docs warn that scheduled
# runs are delayed under load and that "high load times include the start of every
# hour"; the first :00 run this schedule ever had did not fire within 20 minutes.
#
# The daily run is at 22:23 UTC, deliberately AFTER the US close in both EDT
# (18:23 ET) and EST (17:23 ET). Running it pre-open, as it first did, would have
# stamped each row with today's date while the prices in it were yesterday's close.
on:
  schedule:
    - cron: '23 22 * * *'            # 18:23 ET (EDT) / 17:23 ET (EST), after the close
    - cron: '23 0-21,23 * * *'       # every other hour: record only
  # The analyst agent pushes a note and nothing was watching for it. Until this
  # existed a note sat in main until whichever scheduled run next reached the
  # daily path, which on a Tuesday measured about eleven and a half hours.
  #
  # It lives in THIS workflow rather than a new one on purpose. The publish step
  # force-pushes an orphan commit to gh-pages with a plain `push -f`, no lease,
  # from a tree snapshotted at the start of the run. Two workflows publishing
  # concurrently means last writer wins with no error, and the loser's work is
  # gone. Sharing this file shares `concurrency: apterreon-brief`, so a push that
  # lands mid-run queues behind it instead of racing it.
  push:
    branches: [main]
    paths:
      - 'theses/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'record = quotes + headlines only; daily = full refresh; publish = rebuild the site from committed data, record nothing'
        type: choice
        options: [daily, record, publish]
        default: daily

permissions:
  contents: write   # required to commit the archive back

concurrency:
  group: apterreon-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # universe is now ~5,600 tickers, up from ~1,500
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: pip install -r requirements.txt

      - name: Determine mode
        id: pick
        run: |
          # A push event carries no schedule, so it would otherwise fall into
          # the "" arm and run a full daily. That is the wrong answer: a daily
          # run appends the fundamentals panel row, and a note pushed at 11:00
          # would stamp mid-session prices with today's date, permanently, in an
          # append-only file. Push rebuilds the site and records nothing.
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=publish
          else
          case "${{ github.event.schedule }}" in
            "23 22 * * *") MODE=daily  ;;
            "")           MODE="${{ github.event.inputs.mode || 'daily' }}" ;;
            *)            MODE=record ;;
          esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      # docs/news and docs/prices are the published site AND the fetch cache:
      # enrich_with_news and enrich_with_prices both decide what to skip by
      # reading these files off disk (lambda_function.py:7059, :7220). Arriving
      # without them means refetching 5,400 Google feeds and 5,447 price
      # histories, which the 15- and 35-minute budgets cannot absorb, so the
      # site would serve partial coverage for days.
      #
      # Restoring is therefore not an optimisation, it is what makes publishing
      # off-branch safe at all. -n keeps anything the main checkout already
      # provided, which is how docs/briefs stays authoritative from main.
      - name: Restore the published site
        run: |
          set -uo pipefail
          # Into a named ref, not FETCH_HEAD: the Commit data step fetches main
          # when a push is rejected, which would overwrite FETCH_HEAD and leave
          # the publish guard comparing against the wrong tree.
          if git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/site" docs
            git archive refs/remotes/origin/gh-pages | tar -x -C "$RUNNER_TEMP/site"
            cp -rn "$RUNNER_TEMP/site/." docs/ 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/site"
            echo "Restored $(find docs/news docs/prices -type f 2>/dev/null | wc -l) cached ticker files."
          else
            echo "No gh-pages branch yet. This run builds it; the fetch passes will be cold."
          fi

      # The offline test suite, in every mode, before anything is fetched or
      # appended. Every past verification in this project was a throwaway
      # script, and the failures they missed were the kind a test that cannot
      # lie catches in a second: a failure alert that was a SyntaxError for a
      # day because nothing parsed it, return_1m published with the wrong sign
      # for 21% of tickers, and year-to-date cash flows read as quarters. It is
      # stdlib only, touches no network and takes about a second.
      #
      # It runs after the site restore on purpose: docs/prices is what lets the
      # SPY-against-^GSPC beta check run against real data instead of skipping.
      #
      # It does not stop the run. A red test must not cost an hour of quotes
      # and headlines, which is the same rule the Drive ingest follows. The
      # "Report test failures" step near the end fails the job instead, after
      # everything else has finished, so the alert still fires.
      - name: Tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      # The universe cache lives in a release asset, not in git. It is a 13 MB file
      # the daily run rewrites whole, and in git every rewrite stayed in history
      # forever: 33 versions and 21.7 MB of the pack by 2026-09-13, adding about
      # 70 MB a month, on course for GitHub's 1 GB guidance inside a year. A
      # release asset replaced with --clobber keeps one copy, does not count toward
      # repository size, and does not expire the way the Actions cache does after
      # seven days without a hit.
      #
      # It is not optional. Under Yahoo's throttling the yfinance pass reaches about
      # 850 of 5,350 tickers per run, so the cache holds the rest of the week's
      # sweep. A run that starts without it rebuilds cold, and a cold daily writes
      # thin coverage into the append-only panel, where it is never corrected: the
      # cold run on 2026-09-04 recorded 67% market-cap coverage. So when the asset
      # exists but cannot be fetched, the run fails instead of falling through.
      - name: Restore the universe cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p state
          # Inside `if !` rather than a bare assignment: Actions runs this with
          # bash -e, which exits on a failed command substitution before the check
          # below can tell "no release yet" apart from an outage.
          if ! CHECK=$(gh release view universe-cache --json tagName 2>&1); then
            case "$CHECK" in
              *[Nn]ot\ [Ff]ound*)
                echo "No universe-cache release yet. This run builds the cache cold."
                exit 0 ;;
            esac
            echo "Could not check for the universe cache: $CHECK"
            exit 1
          fi
          for i in 1 2 3; do
            if gh release download universe-cache -p stocks_universe.json -D state --clobber; then
              cp state/stocks_universe.json "$RUNNER_TEMP/universe-before.json"
              echo "Restored the universe cache ($(wc -c < state/stocks_universe.json) bytes)."
              exit 0
            fi
            echo "Download attempt $i failed; retrying."
            sleep 5
          done
          echo "The universe-cache release exists but its asset could not be downloaded."
          echo "Refusing to continue: a cold rebuild would write thin coverage into the panel."
          exit 1

      # The analyst's cloud routine can clone this repository but not push to it,
      # so it delivers each run to the owner's Google Drive and this step brings
      # it in. theses/bin/ingest.py explains why it trusts nothing it reads there
      # and checks everything again against committed code.
      #
      # It runs before Gather in every mode, so a delivered run lands within the
      # hour. It never fails the job by itself: a Drive outage or a refused
      # delivery must not stop quotes and headlines being recorded. The "Report
      # ingest problems" step near the end fails the job instead, after
      # everything else has finished, so the alert still fires.
      #
      # Nothing is committed unless ingest.py finished and left a readable result.
      # Anything else it left under theses/ is discarded before Gather runs.
      - name: Ingest analyst runs from Drive
        id: ingest
        continue-on-error: true
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          set -uo pipefail
          export INGEST_RESULT="$RUNNER_TEMP/ingest.env"
          rm -f "$INGEST_RESULT"
          INGESTED_RUNS=0
          INGEST_ALERT=1
          INGEST_MESSAGE=""
          OK=1
          if ! python3 theses/bin/ingest.py; then
            echo "ingest.py exited non-zero, which it is written never to do. Nothing it wrote is committed."
            OK=0
          elif [ ! -s "$INGEST_RESULT" ] || ! . "$INGEST_RESULT"; then
            echo "ingest.py left no readable result. Nothing it wrote is committed."
            OK=0
          fi
          COMMITTED=0
          if [ "$OK" = 1 ]; then
            git config user.name "apterreon-bot"
            git config user.email "actions@users.noreply.github.com"
            git add theses/
            if ! git diff --cached --quiet; then
              git commit -q -m "$INGEST_MESSAGE" && COMMITTED=1 && echo "Committed: $INGEST_MESSAGE"
            fi
          fi
          git reset -q -- theses/ 2>/dev/null || true
          git checkout -q -- theses/ 2>/dev/null || true
          git clean -fdq -- theses/ 2>/dev/null || true
          [ "$OK" = 1 ] || INGEST_ALERT=1
          {
            echo "ingested_runs=${INGESTED_RUNS:-0}"
            echo "committed=$COMMITTED"
            echo "alert=${INGEST_ALERT:-1}"
          } >> "$GITHUB_OUTPUT"

      - name: Gather
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python lambda_function.py "${{ steps.pick.outputs.mode }}"

      # A record run does not render the site, so research ingested during one
      # would otherwise wait for the next daily run to appear. Publish mode
      # rebuilds the pages from committed data in under a second.
      - name: Rebuild the site for ingested research
        if: steps.ingest.outputs.ingested_runs != '0' && steps.ingest.outputs.ingested_runs != '' && steps.pick.outputs.mode == 'record'
        run: python lambda_function.py publish

      # This step used to destroy the previous run's work every night.
      #
      # It did `git fetch` then `git reset --soft origin/main` then
      # `git add data/ docs/ state/`. reset --soft moves HEAD to the remote tip
      # WITHOUT touching the working tree, so `git add` then staged this run's
      # tree, checked out before the other run landed, as the truth. Every file
      # the other run had added was staged as a deletion. Last writer won by
      # deleting, over 10,686 files.
      #
      # It reverted the daily run on five consecutive nights, typically about
      # sixty seconds after it finished: the panel rows for 2026-09-04, -05, -07
      # and -08, the ticker registry, state/news_fetch_log.json back to `{}`
      # (which forced all 5,461 news files to refetch on every subsequent run),
      # and the whole published site. Every one of those runs reported success.
      #
      # The order is now the safe one: commit our own work first against the
      # tree we actually generated it from, and only reconcile if the push is
      # rejected. A rebase replays our commit on top of theirs, so their work
      # survives by construction rather than by luck. The append-only CSVs carry
      # `merge=union` in .gitattributes, so concurrent appends keep both sides.
      - name: Commit data
        run: |
          set -uo pipefail
          git config user.name "apterreon-bot"
          git config user.email "actions@users.noreply.github.com"
          # .gitattributes asks for the union driver by name; define it.
          git config merge.union.name "keep both sides of an append-only file"
          git config merge.union.driver "git merge-file --union -L ours -L base -L theirs %A %O %B"

          git add data/ docs/ state/
          if git diff --cached --quiet; then
            # The ingest step commits research separately. Exiting here without
            # pushing would leave that commit on the runner, to vanish with it.
            if [ "${{ steps.ingest.outputs.committed }}" != "1" ]; then
              echo "Nothing generated this run, so nothing to commit."
              exit 0
            fi
            echo "Gather staged nothing new; pushing the ingested research."
          else
            git commit -m "${{ steps.pick.outputs.mode }}: $(date -u +%FT%H:%M)Z"
          fi

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected on attempt $i; another run landed first. Rebasing onto it."
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            # A conflict in docs/ or state/ is a regenerated artefact, and this
            # run's render is the fresher one. During a rebase that is --theirs:
            # "ours" is the branch being rebased onto, origin/main, and "theirs"
            # is the commit being replayed, which is this run's. This used --ours
            # and so kept the remote's copy, the opposite of what it said. The
            # data/ CSVs never reach this path because union resolves them.
            echo "Rebase conflict; preferring this run's freshly generated artefacts."
            git checkout --theirs -- docs/ 2>/dev/null || true
            git checkout --theirs -- state/ 2>/dev/null || true
            # Nothing else may be resolved that way. A conflict under theses/ is
            # a note or a ledger, and git add -A would commit the conflict markers
            # into an append-only file. Abort instead: the next run starts from a
            # fresh checkout and ingests the same delivery again cleanly.
            UNRESOLVED=$(git diff --name-only --diff-filter=U -- . ':!docs' ':!state')
            if [ -n "$UNRESOLVED" ]; then
              echo "Refusing to resolve a conflict outside docs/ and state/: $UNRESOLVED"
              git rebase --abort || true
              exit 1
            fi
            git add -A
            if ! git -c core.editor=true rebase --continue; then
              echo "Could not reconcile with the remote; aborting rather than overwriting it."
              git rebase --abort || true
              exit 1
            fi
            sleep 3
          done
          echo "Failed to push after 5 attempts."
          exit 1

      # The site is a snapshot, not a history, so it gets a branch that is one
      # orphan commit deep and force-pushed every run.
      #
      # It used to live in main, where 10,900 per-ticker JSON files rewritten in
      # full every run made docs/ 161 MB of the repository's 197 MB and cost
      # 12-20 MB per daily run. data/, which is the actual product, is 3.9 MB.
      # At that rate the repo reached GitHub's 1 GB warning in about five weeks.
      - name: Publish the site
        run: |
          set -uo pipefail
          # Nothing here is recoverable from a later run, so refuse to publish a
          # tree that is missing the things a real render always produces.
          if [ ! -s docs/index.html ] || [ ! -s docs/stocks.html ]; then
            echo "Refusing to publish: the render did not produce a site."
            exit 1
          fi

          IDX="$RUNNER_TEMP/ghp.idx"
          rm -f "$IDX"
          ( cd docs && GIT_INDEX_FILE="$IDX" git --git-dir="$GITHUB_WORKSPACE/.git"               --work-tree=. add -A . )
          TREE=$(GIT_INDEX_FILE="$IDX" git write-tree)

          # docs/briefs is the one thing under docs/ that cannot be regenerated.
          # A force-push publishes whatever is on disk, so check the archive has
          # not shrunk before overwriting the only other copy of it.
          NEW=$(git ls-tree -r --name-only "$TREE" -- briefs | wc -l)
          OLD=0
          if git rev-parse -q --verify refs/remotes/origin/gh-pages >/dev/null 2>&1; then
            OLD=$(git ls-tree -r --name-only refs/remotes/origin/gh-pages -- briefs | wc -l)
          fi
          if [ "$NEW" -lt "$OLD" ]; then
            echo "Refusing to publish: the brief archive went from $OLD to $NEW files."
            exit 1
          fi

          COMMIT=$(git commit-tree "$TREE" -m "site: $(date -u +%FT%H:%M)Z")
          git push -f origin "$COMMIT:refs/heads/gh-pages"
          echo "Published $(git ls-tree -r --name-only "$TREE" | wc -l) files ($NEW briefs)."

      # Runs even when an earlier step failed. The cache is written only at the end
      # of a completed regeneration, so a copy on disk that differs from the one
      # restored is a finished day of accumulation, and losing it to a failure in
      # site rendering or the git push would cost a day of the sweep. A truncated
      # or gutted file is caught by the row check below.
      #
      # One gap is accepted rather than engineered around. `gh release upload
      # --clobber` deletes the old asset before uploading the new one, so if every
      # attempt fails after that delete, the release is left without an asset. The
      # next run then fails at the restore step instead of rebuilding cold, which is
      # the safe direction: nothing thin reaches the panel, and the alert fires.
      # Recovery is to delete the universe-cache release, which makes the following
      # run rebuild cold as a deliberate choice.
      - name: Save the universe cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          NEW=state/stocks_universe.json
          OLD="$RUNNER_TEMP/universe-before.json"
          if [ ! -s "$NEW" ]; then
            echo "No universe cache on disk; nothing to save."
            exit 0
          fi
          # Record runs that did not promote, and the stale fallbacks, return
          # without rewriting the file.
          if [ -s "$OLD" ] && cmp -s "$NEW" "$OLD"; then
            echo "Universe cache unchanged this run; nothing to save."
            exit 0
          fi
          # The release asset is the only copy, so refuse to replace it with one
          # that lost more than a tenth of its rows. That is the same threshold the
          # scrape guard in get_or_generate_stocks_universe treats as a source failure.
          python3 - "$OLD" "$NEW" <<'PY' || exit 1
          import json, os, sys
          def rows(path):
              if not os.path.exists(path) or not os.path.getsize(path):
                  return None
              return len(json.load(open(path)).get("stocks") or [])
          old, new = rows(sys.argv[1]), rows(sys.argv[2])
          print(f"Universe cache rows: {old} before, {new} after.")
          if not new:
              sys.exit("Refusing to save: the new cache has no rows.")
          if old and new < 0.9 * old:
              sys.exit("Refusing to save: the cache lost more than 10% of its rows.")
          PY
          if ! gh release view universe-cache >/dev/null 2>&1; then
            gh release create universe-cache --prerelease --title "Universe cache" \
              --notes "Resume state for the daily run, replaced in place by the workflow. Not a software release." || exit 1
          fi
          for i in 1 2 3; do
            if gh release upload universe-cache "$NEW" --clobber; then
              echo "Saved the universe cache ($(wc -c < "$NEW") bytes)."
              exit 0
            fi
            echo "Upload attempt $i failed; retrying."
            sleep 5
          done
          echo "Failed to save the universe cache. The next run resumes from the previous copy."
          exit 1

      # The ingest step never fails the job itself, so that a Drive outage or a
      # bad delivery cannot stop the day's data being recorded. This is where it
      # does fail, last, so the alert below fires with everything else finished.
      # A refused delivery alerts once: ingest.py skips it until its files change.
      - name: Report ingest problems
        if: always() && (steps.ingest.outcome == 'failure' || steps.ingest.outputs.alert == '1')
        run: |
          echo "The Drive ingest refused a delivery or could not run. The 'Ingest analyst runs from Drive' step log says which, and why."
          exit 1

      # The Tests step never fails the job itself, for the reason given there.
      # This is where a failing suite does, last, so the alert below fires.
      - name: Report test failures
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "The offline test suite failed. The 'Tests' step log names each failing test and why."
          exit 1

      # Between 2026-05-09 and 2026-07-07 this job failed 78 times without anyone
      # noticing, because the brief email was sent before the step that crashed.
      # Nothing emails on success any more, so this alert is the only signal.
      - name: Alert on failure
        # Not `failure()` alone: a job killed by timeout-minutes is CANCELLED,
        # not failed, so the most likely hard failure was the one that never
        # alerted. cancelled() also covers a run the concurrency group drops.
        if: failure() || cancelled()
        env:
          APTERREON_ICLOUD_APP_PASSWORD: ${{ secrets.APTERREON_ICLOUD_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.pick.outputs.mode }}
          JOB_STATUS: ${{ job.status }}
        # One line, calling into code the Gather step already imports. The
        # previous version was 17 lines of Python embedded in YAML that nothing
        # parsed until a failure ran it, and it did not parse.
        run: >-
          python -c "import os, lambda_function as L;
          L.send_failure_alert(os.environ['MODE'], os.environ['JOB_STATUS'], os.environ['RUN_URL'])"
