name: apterreon-brief

on:
  schedule:
    - cron: '0 11 * * *'    # morning  ~7am ET
    - cron: '15 16 * * *'   # midday   ~12:15pm ET
    - cron: '45 20 * * *'   # evening  ~4:45pm ET
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to generate'
        type: choice
        options: [morning, midday, evening]
        default: morning

permissions:
  contents: write   # required to commit the archive back

concurrency:
  group: apterreon-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # first run of a new ISO week does a full universe rebuild (~20+ min)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: pip install -r requirements.txt

      - name: Determine edition
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 11 * * *")  EDITION=morning ;;
            "15 16 * * *") EDITION=midday  ;;
            "45 20 * * *") EDITION=evening ;;
            *)             EDITION="${{ github.event.inputs.edition || 'morning' }}" ;;
          esac
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "Edition: $EDITION"

      - name: Generate brief
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHAVANTAGE_API_KEY:       ${{ secrets.ALPHAVANTAGE_API_KEY }}
          APTERREON_ICLOUD_APP_PASSWORD: ${{ secrets.APTERREON_ICLOUD_APP_PASSWORD }}
          APTERREON_MODEL:               ${{ vars.APTERREON_MODEL || 'claude-haiku-4-5-20251001' }}
          APTERREON_READER_CONTEXT:      ${{ vars.APTERREON_READER_CONTEXT }}
          RECIPIENTS:                 ${{ vars.RECIPIENTS }}
        run: python lambda_function.py "${{ steps.pick.outputs.edition }}"

      - name: Commit archive
        run: |
          set +e
          git config user.name "apterreon-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # Sync to latest remote main, keep our generated working-tree changes.
            git fetch origin main
            git reset --soft origin/main
            git reset HEAD -- . >/dev/null 2>&1   # unstage anything pre-existing
            git add docs/ state/
            if git diff --cached --quiet; then
              echo "No changes to commit (after sync)."
              exit 0
            fi
            git commit -m "brief: $(date -u +%F) ${{ steps.pick.outputs.edition }}"
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (concurrent push?). Resyncing and retrying in 3s..."
            sleep 3
          done
          echo "Failed to push after 5 attempts."
          exit 1

      # Between 2026-05-09 and 2026-07-07 this job failed 78 times without anyone
      # noticing: the brief email is sent before the archive step, so a late crash
      # still delivered mail and the breakage stayed invisible. Alert on failure.
      - name: Alert on failure
        if: failure()
        env:
          APTERREON_ICLOUD_APP_PASSWORD: ${{ secrets.APTERREON_ICLOUD_APP_PASSWORD }}
          RECIPIENTS: ${{ vars.RECIPIENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EDITION: ${{ steps.pick.outputs.edition }}
        run: |
          python - <<'PY'
          import os
          from lambda_function import send_email

          edition = os.environ.get("EDITION") or "unknown"
          run_url = os.environ["RUN_URL"]
          send_email(
              f"apterreon-brief FAILED ({edition})",
              "<h2>The brief workflow failed.</h2>"
              f"<p>Edition: <b>{edition}</b></p>"
              f'<p><a href="{run_url}">Open the failed run</a></p>'
              "<p>The email for this edition may still have been sent: the archive "
              "and site rebuild run after delivery.</p>",
          )
          print("Failure alert sent.")
          PY
